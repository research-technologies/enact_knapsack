# Hyku::Application.path_for prefers the knapsack copy and REPLACES rather than merges, so every
# upstream entry has to be repeated here or it vanishes from the admin picker. Keep the five Hyku
# entries in sync with hyrax-webapp/config/home_themes.yml when the submodule moves.
default_home:
  banner_image: true
  featured_researcher: true
  home_page_text: false
  marketing_text: true
  name: Default home
  notes: This theme is the default Hyku view
cultural_repository:
  banner_image: true
  featured_researcher: false
  home_page_text: true
  marketing_text: true
  name: Cultural Repository
  notes: This theme is recommended for cultural repositories
institutional_repository:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Institutional Repository
  notes: This theme is recommended for institutional repositories
neutral_repository:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Neutral Repository
  notes: This theme is neutral and is recommended for all types of repositories
community:
  banner_image: true
  featured_researcher: false
  home_page_text: true
  marketing_text: true
  name: Community
  notes: This theme is for demoing Hyku features
enact_home:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  # false because nothing here renders the Marketing text block, and a true would promise it in the
  # admin Appearance page.
  marketing_text: false
  name: Enact Home Page
  notes: Search-led hero over the banner image, a counts band, curated featured portfolios, browse by work type, recent deposits and a featured researcher. Every module hides itself when it has nothing to show.

# Human-friendly labels for compound sub-properties on show-page cards.
# Hyrax::Renderers::CompoundAttributeRenderer#sub_property_label looks up
# `hyrax.compound_fields.<compound>.<sub_property>` and falls back to the
# humanized field name (which produced "Rightsuri", "Rightsidentifierscheme",
# etc.). The card title already supplies the "Rights"/"Provenance" context, so
# the sub-labels are kept short.
en:
  hyrax:
    compound_fields:
      rights:
        statement: Statement
        holder: Rights holder
      provenance:
        provenanceScheme: Scheme
        schemeURI: Scheme URL
        provenanceEmbedded: Embedded in file
        embedFormat: Embedded format
      contributors:
        contributor_name: Name
        given_name: Given name
        family_name: Family name
        role_label: Role
        name_identifier: ORCID
        affiliation: Affiliation
      relationships:
        type_other: Other relationship type
        # How the free-text "Other" relationship reads from the linked work's
        # side; the label names that perspective so curators know which way round.
        type_other_inverse: Linked Work's Relationship Type
      dates:
        start_date: Start date
        end_date: End date
      errors:
        # Raised by Hyrax::CompoundEntryValidationDecorator; deep-merges with
        # Hyrax's own keys under this same path.
        #
        # CONTRIBUTE BACK with that decorator: a profile-declared `ordered` rule
        # needs a message of its own, and it belongs beside Hyrax's
        # required_but_empty / missing_required_subproperties. Word it for any
        # comparable pair rather than for dates. (The sub-property labels above stay
        # here — they name Enact's own fields.)
        end_before_start: "Each %{compound} entry must end on or after its start date"

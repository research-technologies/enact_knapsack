    source: enact
    note: Periodic or interim report on a funding cycle, distinct from the final Research report. AAT annual reports (300027292) covers organisational annual reporting only, so an Enact-local id is used. Evidence JO-TODD and PPP-QMUL both operate on funder reporting cycles.

    term: Picture book
    file_suffixes: [pdf, epub, jpg, jpeg, png]
    note: Illustrated book for children or beginning readers, where the images, sequencing and object are the finding. Book flattens it into a monograph. Evidence JO-ODDKIN Making Odd Kin, ISBN 0-9549110-5-9, Maxart, co-made with children and a nursery.
  - id: https://datacite-metadata-schema.readthedocs.io/en/4.5/appendices/appendix-1/resourceTypeGeneral/#preprint
    term: Pre-Print
  - id: https://enact.ac.uk/vocab/literature_type/policy-briefing
    term: Policy briefing
    file_suffixes: [pdf, docx, doc]
    source: enact
    note: Short, targeted, non-scholarly briefing for a policy audience, distinct from the longer Policy report. Evidence PPP-QMUL four city briefings for Cardiff, Manchester, Glasgow and London, issued alongside a final report.
  - id: https://vocabularies.coar-repositories.org/resource_types/c_186u/
    term: Policy report
    note: Scope — full-length policy report. For a short targeted briefing use Policy briefing. Evidence PPP-QMUL Relative Values final report against its four city briefings.
  - id: https://enact.ac.uk/vocab/literature_type/practice-research-portfolio
    term: Practice research portfolio
    file_suffixes: [pdf, docx, doc]
    source: enact
    note: Compound, structured, discipline-specific portfolio document — typically project summary, research statement, theoretical context, timeline, research questions, aims, methods, key findings, dissemination, references and appendices. Previously scattered across Text, Report, Research report and Methodology. Evidence RH-RITUAL Creative Practice Research Portfolio PDF, VW-AIRGRID REF2014 written account / portfolio text.
  - id: http://vocab.getty.edu/page/aat/300027240
    term: Programme
  - id: https://vocabularies.coar-repositories.org/resource_types/c_18op/
    term: Project deliverable
  - id: https://vocabularies.coar-repositories.org/resource_types/YZ1N-ZFT9/
    term: Research protocol
  - id: https://vocabularies.coar-repositories.org/resource_types/c_18ws/
    term: Research report
    note: Scope — the final report on a piece of research. For interim or annual reporting within a funding cycle use Annual / progress report. Evidence RH-RITUAL ACE project report (final) against JO-TODD and PPP-QMUL funder reporting cycles.
  - id: https://enact.ac.uk/vocab/literature_type/research-statement
    term: Research statement
    file_suffixes: [pdf, docx, doc]
    source: enact
    note: The REF practice-research 300-word statement — short, structured, mandatory for assessment and the single most citable piece of text a practice researcher produces. Evidence RH-RITUAL on Zenodo (10.5281/zenodo.20020238), VH-STAIR on Screenworks (10.37186/swrks/15.1/11).
  - id: https://vocabularies.coar-repositories.org/resource_types/c_18gh/
    term: Technical report
  - id: https://vocabularies.coar-repositories.org/resource_types/c_71bd/
    term: Technical documentation
    note: Scope — systems and technical documentation. For practitioner-facing guidance use Toolkit.
  - id: https://vocabularies.coar-repositories.org/resource_types/c_46ec/
    term: Thesis
    file_suffixes: [pdf, docx, doc]

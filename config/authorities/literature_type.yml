    term: Review article
  - id: http://vocab.getty.edu/page/aat/300026491
    term: Script / Screenplay
    file_suffixes: [pdf, docx, doc, fdx]
    note: Written form of a story prepared for screen or stage production, including characters, scenes, settings, dialogue and directions. Nothing in artefact_type or literature_type previously fitted; Manuscript was the fallback and carried the wrong frame. Evidence VH-STAIR 4 script items, VH-VICT 1.

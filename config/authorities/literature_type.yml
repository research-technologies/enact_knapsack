  - id: https://vocabularies.coar-repositories.org/resource_types/c_18cw/
    term: Musical notation
    note: Scope — the score as carrier, the notated expression fixed as a file. The composition as a work is artefact_type Sound - MusicComposition; the two records are joined by the new realisation relationship (relationship_types is-realisation-of / has-realisation) rather than by duplicating a score term into artefact_type, per the cross-cutting decision. Correct term at term level, no change needed. Evidence SM-FORK circa 10 scores each declared as item type score (.pdf) and each paired with a performance recording.

    term: Abstract book
    file_suffixes: [pdf, docx, doc]
    source: enact
    note: Book of abstracts issued by a conference or symposium, often the only published trace of an invited keynote. Evidence JO-ODDKIN ECQI 2025 and NERA 2025 abstract books.

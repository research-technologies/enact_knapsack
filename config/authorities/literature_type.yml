    term: Magazine
  - id: https://vocabularies.coar-repositories.org/resource_types/c_0040/
    term: Manuscript
    note: Scope — an unpublished scholarly text. For a film or screen script use Script / Screenplay, which was previously absent and forced these items here. Evidence VH-STAIR Script Draft, Script, Annotated Script Notes and Suggestions for Part Three, VH-VICT Annotated Script.

    term: Impact case study
    file_suffixes: [pdf, docx, doc]
    source: enact
    note: REF-style structured impact case study. AAT case studies (300460253) is the generic research-method sense and does not carry the assessment genre, so an Enact-local id is used. Evidence PPP-QMUL GCRF impact case study, previously forced into Report.

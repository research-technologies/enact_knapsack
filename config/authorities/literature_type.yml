  - id: https://vocabularies.coar-repositories.org/resource_types/c_8544/
    term: Lecture
    note: Scope — the text of a lecture (script, paper or transcript) deposited as an output. For the occasion at which it was delivered see event_type Lecture, Getty AAT 300026673. Both senses are in live use in this cohort; neither term is deprecated. Evidence JO-ODDKIN Northern Nursery Public Lecture Sydney, WM-PRIM lecture / conversation between Fiona McLachlan and Will McLean.
  - id: https://vocabularies.coar-repositories.org/resource_types/c_0857/
    term: Letter

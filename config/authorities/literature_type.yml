  - id: https://enact.ac.uk/vocab/literature_type/toolkit
    term: Toolkit
    file_suffixes: [pdf, docx, doc]
    source: enact
    note: Practitioner-facing guidance document. Technical documentation is aimed at systems, not practitioners. AAT tool kits (300434886) denotes physical sets of tools and is the wrong sense, so an Enact-local id is used. Evidence PPP-QMUL Relative Values Toolkit.
  - id: https://vocabularies.coar-repositories.org/resource_types/H6QP-SC1X/
    term: Trademark
  - id: https://vocabularies.coar-repositories.org/resource_types/6NC7-GK9S/
    term: Transcription
    note: Scope — a written record of spoken or performed material, where the text is itself the evidence. Correct for AC-SONGS workshop transcriptions, PC-PORTS recorded interviews and PPP-QMUL community interview material. NOT for a descriptive or accessibility transcript, which describes an audiovisual work for a viewer who cannot see or hear it; that is an accessibility surrogate bound to a specific file and belongs on the artefact record, not as an independent Literature output. Evidence VH-STAIR descriptive (accessibility) transcript (.pdf).
  - id: https://vocabularies.coar-repositories.org/resource_types/c_baaf/
    term: Research proposal
    note: Scope — a proposal for research funding (the COAR sense). NOT an architectural or design proposal submitted to a client; for those use the artefact_type design terms, principally Design - ArchitecturalDesign or Design. Evidence WM-PRIM design proposal documents (A Machine for Learning, School as a Rule Wonderwall, Dalry Primary School, Original proposal to North Ayrshire, Proposal for Lawthorn Primary School) score this term to 5 and will mis-file without this distinction.

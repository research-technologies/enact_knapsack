# DataCite relationType vocabulary for the `relationships` compound, read via
# Enact::RelationshipTypesService, plus a small set of Enact-local extensions
# (`source: enact`) for edges DataCite cannot express. Non-QA keys: `inverse:`
# (how the edge reads from the target's side; a symmetric term points at itself)
# and optional `color:` (map edge colour; uncoloured terms share a neutral
# fallback). Enact-local terms carry no `datacite:` key — on DataCite export
# they fall back to `Other` plus the free-text `type_other` /
# `type_other_inverse` subproperties.
terms:
  - id: iscitedby
    term: Is Cited By
    source: datacite
    datacite: IsCitedBy
    inverse: cites
    color: '#c9544b'
  - id: cites
    term: Cites
    source: datacite
    datacite: Cites
    inverse: iscitedby
    color: '#c9544b'
  - id: issupplementto
    term: Is Supplement To
    source: datacite
    datacite: IsSupplementTo
    inverse: issupplementedby
  - id: issupplementedby
    term: Is Supplemented By
    source: datacite
    datacite: IsSupplementedBy
    inverse: issupplementto
  - id: iscontinuedby
    term: Is Continued By
    source: datacite
    datacite: IsContinuedBy
    inverse: continues
    color: '#5b9bd5'
  - id: continues
    term: Continues
    source: datacite
    datacite: Continues
    inverse: iscontinuedby
    color: '#5b9bd5'
  - id: describes
    term: Describes
    source: datacite
    datacite: Describes
    inverse: isdescribedby
    color: '#a3c43a'
  - id: isdescribedby
    term: Is Described By
    source: datacite
    datacite: IsDescribedBy
    inverse: describes
    color: '#a3c43a'
  - id: hasmetadata
    term: Has Metadata
    source: datacite
    datacite: HasMetadata
    inverse: ismetadatafor
    note: 'Usually system-set; offer to depositors only behind an advanced option.'
  - id: ismetadatafor
    term: Is Metadata For
    source: datacite
    datacite: IsMetadataFor
    inverse: hasmetadata
    note: 'Usually system-set; offer to depositors only behind an advanced option.'
  - id: hasversion
    term: Has Version
    source: datacite
    datacite: HasVersion
    inverse: isversionof
    color: '#4040c4'
  - id: isversionof
    term: Is Version Of
    source: datacite
    datacite: IsVersionOf
    inverse: hasversion
    color: '#4040c4'
    note: 'See `hasversion`.'
  - id: isnewversionof
    term: Is New Version Of
    source: datacite
    datacite: IsNewVersionOf
    inverse: ispreviousversionof
    color: '#4040c4'
  - id: ispreviousversionof
    term: Is Previous Version Of
    source: datacite
    datacite: IsPreviousVersionOf
    inverse: isnewversionof
    color: '#4040c4'
    note: 'Use for a superseded draft kept as process evidence (not obsoletes).'
  - id: ispartof
    term: Is Part Of
    source: datacite
    datacite: IsPartOf
    inverse: haspart
    color: '#c2a83e'
  - id: haspart
    term: Has Part
    source: datacite
    datacite: HasPart
    inverse: ispartof
    color: '#c2a83e'
  - id: ispublishedin
    term: Is Published In
    source: datacite
    datacite: IsPublishedIn
  - id: isreferencedby
    term: Is Referenced By
    source: datacite
    datacite: IsReferencedBy
    inverse: references
  - id: references
    term: References
    source: datacite
    datacite: References
    inverse: isreferencedby
  - id: isdocumentedby
    term: Is Documented By
    source: datacite
    datacite: IsDocumentedBy
    inverse: documents
    color: '#4aa3a3'
  - id: documents
    term: Documents
    source: datacite
    datacite: Documents
    inverse: isdocumentedby
    color: '#4aa3a3'
  - id: iscompiledby
    term: Is Compiled By
    source: datacite
    datacite: IsCompiledBy
    inverse: compiles
  - id: compiles
    term: Compiles
    source: datacite
    datacite: Compiles
    inverse: iscompiledby
  - id: isvariantformof
    term: Is Variant Form Of
    source: datacite
    datacite: IsVariantFormOf
    inverse: isoriginalformof
    color: '#b05ec0'
    note: 'DataCite sense: calculated, calibrated or repackaged forms. For master/dissemination copies use Is Source Of / Is Derived From.'
  - id: isoriginalformof
    term: Is Original Form Of
    source: datacite
    datacite: IsOriginalFormOf
    inverse: isvariantformof
    color: '#b05ec0'
    note: 'DataCite sense: calculated, calibrated or repackaged forms. For master/dissemination copies use Is Source Of / Is Derived From.'
  - id: isidenticalto
    term: Is Identical To
    source: datacite
    datacite: IsIdenticalTo
    inverse: isidenticalto
  - id: isreviewedby
    term: Is Reviewed By
    source: datacite
    datacite: IsReviewedBy
    inverse: reviews
    color: '#40964a'
  - id: reviews
    term: Reviews
    source: datacite
    datacite: Reviews
    inverse: isreviewedby
    color: '#40964a'
  - id: isderivedfrom
    term: Is Derived From
    source: datacite
    datacite: IsDerivedFrom
    inverse: issourceof
    color: '#c0823c'
  - id: issourceof
    term: Is Source Of
    source: datacite
    datacite: IsSourceOf
    inverse: isderivedfrom
    color: '#c0823c'
  - id: isrequiredby
    term: Is Required By
    source: datacite
    datacite: IsRequiredBy
    inverse: requires
    note: 'Technical dependency (e.g. a file needing particular software or assets). Consider showing behind an advanced option.'
  - id: requires
    term: Requires
    source: datacite
    datacite: Requires
    inverse: isrequiredby
    note: 'Technical dependency (e.g. a file needing particular software or assets). Consider showing behind an advanced option.'
  - id: obsoletes
    term: Obsoletes
    source: datacite
    datacite: Obsoletes
    inverse: isobsoletedby
    note: 'Rarely right in practice research, which keeps superseded drafts. Prefer the version terms and the Process typology.'
  - id: isobsoletedby
    term: Is Obsoleted By
    source: datacite
    datacite: IsObsoletedBy
    inverse: obsoletes
    note: 'Rarely right in practice research. Prefer the version terms and the Process typology.'
  - id: iscollectedby
    term: Is Collected By
    source: datacite
    datacite: IsCollectedBy
    inverse: collects
    color: '#45c445'
  - id: collects
    term: Collects
    source: datacite
    datacite: Collects
    inverse: iscollectedby
    color: '#45c445'
  # Enact-local extension: DataCite has no 'is a realisation of' (score -> performance,
  # script -> film). Exports to DataCite as Other + type_other.
  - id: is-realisation-of
    term: Is Realisation Of
    source: enact
    inverse: has-realisation
    color: '#c43f7d'
    note: 'A performance, recording or film realising a score or script.'
  - id: has-realisation
    term: Has Realisation
    source: enact
    inverse: is-realisation-of
    color: '#c43f7d'
    note: 'A score or script and its realisations (performances, recordings, films). Inverse of is-realisation-of.'
  # Free-text escape hatch, mirroring the `other` role in contributor_roles.yml:
  # selecting "Other" pairs with the sibling `type_other` (+ `type_other_inverse`)
  # free-text subproperties. `inverse: other` is the symmetric fallback used when
  # no `type_other_inverse` is supplied. Deliberately left on the neutral map
  # colour: an unnamed edge should not claim a semantic family.
  - id: other
    term: Other
    source: datacite
    datacite: Other
    inverse: other
  # Pre-DataCite vocabulary, retained so edges stored before the switch keep working.
  # sequence / sequence-of, pair-with and juxtaposed-with are REINSTATED as active
  # Enact-local terms: do not re-retire. The rest stay active: false and duplicate live
  # terms (source-of = issourceof, derived-from = isderivedfrom,
  # referenced-by = isreferencedby).
  - id: sequence
    term: Sequence
    source: enact
    inverse: sequence-of
    color: '#2f5aae'
    active: true
    note: 'Reinstated — do not re-retire. Ordered succession: parts, episodes or numbered stages.'
  - id: sequence-of
    term: Sequence Of
    source: enact
    inverse: sequence
    color: '#2f5aae'
    active: true
    note: 'Reinstated — do not re-retire. Inverse of sequence.'
  - id: source-of
    term: Source Of
    inverse: derived-from
    color: '#c0823c'
    active: false
  - id: derived-from
    term: Derived From
    inverse: source-of
    color: '#c0823c'
    active: false
  - id: pair-with
    term: Pair With
    source: enact
    inverse: pair-with
    color: '#6ecfab'
    active: true
    note: 'Reinstated — do not re-retire. Symmetric pairing where neither item is primary, e.g. a score and its performance.'
  - id: response-to
    term: Response To
    inverse: referenced-by
    color: '#c9544b'
    active: false
  - id: referenced-by
    term: Referenced By
    inverse: response-to
    color: '#c9544b'
    active: false
  - id: juxtaposed-with
    term: Juxtaposed With
    source: enact
    inverse: juxtaposed-with
    color: '#c57792'
    active: true
    note: 'Reinstated — do not re-retire. Items placed beside one another for comparison, with no derivation or sequence implied.'

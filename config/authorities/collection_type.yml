# collection_type.yml — grouping vocabulary for Enact collection records.
# Collections may hold both Artefact and Literature records, so a multi-component
# output split across the two record types can be reassembled here.
# Locally minted terms use bare string ids and source: enact. Retired terms are set
# active: false (never deleted) so existing records still resolve.
terms:
  - id: https://datacite-metadata-schema.readthedocs.io/en/4.5/appendices/appendix-1/resourceTypeGeneral/#collection
    term: Collection
    note: 'General grouping, where no more specific grouping principle applies. May mix Artefact and Literature records.'
  - id: http://vocab.getty.edu/page/aat/300026037
    term: Anthology
  - id: http://vocab.getty.edu/page/aat/300375748
    term: Archive
    file_suffixes: [zip, pdf]
  - id: curated_set
    term: Curated set
    file_suffixes: [zip, pdf]
  - id: https://datacite-metadata-schema.readthedocs.io/en/4.7/appendices/appendix-1/resourceTypeGeneral/#dataset
    term: Dataset
  - id: http://vocab.getty.edu/page/aat/300417531
    term: Exhibition
    note: 'Items grouped because they belong to one exhibition.'
  - id: master_and_derivatives
    term: Master and derivatives
    source: enact
    note: 'One work held with its preservation master and its dissemination copies.'
  - id: multi_component_output
    term: Multi-component output
    source: enact
    note: 'One output made of several declared components, described as a named whole (the REF practice-research shape).'
  - id: http://vocab.getty.edu/page/aat/300179434
    term: Portfolio subset
    note: 'One declared component of a larger output. For the whole, use Multi-component output.'
  - id: project
    term: Project
    source: enact
    note: 'A project or grant used as the grouping principle.'
  - id: version_group
    term: Version group
    source: enact
    note: 'A work held with its successive versions, and any attached peer reviews.'
  - id: https://schema.org/Menu
    term: Menu
    active: false
    note: 'Deprecated: not applicable to practice research. Kept so existing records still resolve.'
  - id: https://schema.org/MusicAlbum
    term: Music Album
  - id: https://schema.org/MusicPlayList
    term: Music Play list
  - id: https://schema.org/RadioSeason
    term: Radio Season
  - id: https://schema.org/RadioSeries
    term: Radio Series
  - id: https://schema.org/CreativeWorkSeries
    term: Series
    note: 'Serial or episodic grouping that is not broadcast: podcasts, video series, seminar series.'
  - id: https://schema.org/TVSeason
    term: TV Season
    active: false
    note: 'Deprecated; for a non-broadcast serial use Series.'
  - id: https://schema.org/TVSeries
    term: TV Series

terms:
  - id: https://datacite-metadata-schema.readthedocs.io/en/4.5/appendices/appendix-1/resourceTypeGeneral/#event
    term: Event
  - id: http://publications.europa.eu/resource/authority/public-event-type/COMPETITION_AWARD_CEREMONY
    term: Award Ceremony
    note: 'The ceremony at which a prize or shortlisting is conferred. For the competition itself use Competition / open call.'
  - id: https://schema.org/ChildrensEvent
    term: Childrens Event
  - id: http://publications.europa.eu/resource/authority/public-event-type/CONFERENCE_SUMMIT
    term: Conference
  - id: https://schema.org/ComedyEvent
    term: Comedy Event
  - id: http://vocab.getty.edu/page/aat/300054760
    term: Competition / open call
    note: 'Competition, open call or juried submission process, as distinct from the ceremony at which the result is announced — see Award Ceremony.'
  - id: https://enact.ac.uk/vocab/event_type/continuing-professional-development
    term: Continuing professional development (CPD)
    source: enact
    note: 'Sector training or professional-development session delivered to practitioners, as distinct from a research Workshop.'
  - id: https://schema.org/DanceEvent
    term: Dance Event
  - id: https://github.com/research-technologies/prvoices_schema/wiki/DesignCharrette
    term: Design Charrette
  - id: https://schema.org/ExhibitionEvent
    term: Exhibition
    file_suffixes: [pdf, jpg, jpeg, png]
  - id: https://schema.org/Festival
    term: Festival
    note: 'Scope — general festival. For a juried or curated film festival with selection, certificates and competition strands use Film festival.'
  - id: http://vocab.getty.edu/page/aat/300263838
    term: Film festival
    note: 'Juried or curated film festival, where selection and certification carry the esteem.'
  - id: https://schema.org/FoodEvent
    term: Food Event
    active: false
    note: 'Deprecated; use Event or Social Event.'
  - id: https://schema.org/Hackathon
    term: Hackathon
  - id: https://enact.ac.uk/vocab/event_type/keynote
    term: Keynote
    source: enact
    note: 'Invited keynote address. Distinct from Lecture.'
  - id: https://enact.ac.uk/vocab/event_type/launch-event
    term: Launch event
    source: enact
    note: 'Public launch of a project, work, building or programme.'
  - id: http://vocab.getty.edu/page/aat/300026673
    term: Lecture
    note: 'The occasion at which a lecture is delivered. For the text of the lecture use literature_type Lecture.'
  - id: https://schema.org/LiteraryEvent
    term: Literary Event
  - id: live_performance
    term: Live performance
    note: 'A timed performance before an audience. Where the work is made for its site, or the audience is immersed in it, use Site-specific / immersive performance.'
  - id: https://schema.org/MusicEvent
    term: Music Event
  - id: https://enact.ac.uk/vocab/event_type/participatory-installation
    term: Participatory installation
    source: enact
    note: 'Installation whose completion depends on audience participation. Exhibition captures the display and Live performance the timing; each loses the participation.'
  - id: http://vocab.getty.edu/page/aat/300266327
    term: Private view / opening
    note: 'Invited opening or private view preceding a public exhibition run.'
  - id: https://enact.ac.uk/vocab/event_type/rehearsal-development-session
    term: Rehearsal / development session
    source: enact
    note: 'Closed working session that makes the work rather than disseminating it.'
  - id: http://vocab.getty.edu/page/aat/300075520
    term: Residency
    file_suffixes: [pdf, docx, doc]
  - id: https://schema.org/ScreeningEvent
    term: Screening
    file_suffixes: [pdf, mp4, mov]
  - id: https://enact.ac.uk/vocab/event_type/site-specific-immersive-performance
    term: Site-specific / immersive performance
    source: enact
    note: 'Performance made for and inseparable from a particular site, or in which the audience is immersed.'
  - id: https://schema.org/SocialEvent
    term: Social Event
  - id: https://schema.org/SportsEvent
    term: Sports Event
    active: false
    note: 'Deprecated; use Event.'
  - id: https://enact.ac.uk/vocab/event_type/summer-school
    term: Summer school
    source: enact
    note: 'Multi-day intensive training programme, often residential.'
  - id: http://vocab.getty.edu/page/aat/300054792
    term: Symposia
  - id: https://schema.org/TheaterEvent
    term: Theatre Event
  - id: https://schema.org/VisualArtsEvent
    term: VisualArtsEvent
  - id: http://vocab.getty.edu/page/aat/300310218
    term: Webinar / online event
    note: 'Online-delivered event. Where the genre is known (workshop, seminar, lecture), prefer that term.'
  - id: http://publications.europa.eu/resource/authority/public-event-type/TRAINING_WORKSHOP
    term: Workshop
    note: 'Workshop or training session. Prefer a more specific term where one fits (CPD, Summer school, Rehearsal / development session).'

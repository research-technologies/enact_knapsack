  - id: http://vocab.getty.edu/page/aat/300041273
    term: Physical Object - LimitedEditionPrint
    file_suffixes: [pdf, tif, tiff, jpg, jpeg, png]
    note: Fine-art or limited-edition print as an editioned object — risograph, letterpress, screenprint, lithograph, etching. AAT "prints (visual works)". Evidence — VW-AIRGRID's The Demonstrators (ISBN 9780955886836), risograph, printed by Bolt Editions; MF-SGSAH by breadth (GSA, ECA and DCA all run print studios). Use for the printed object itself; Design - LayoutDesign describes only the page layout.

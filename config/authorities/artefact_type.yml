  - id: https://vocabularies.coar-repositories.org/resource_types/c_c513/
    term: Visual Media
  - id: https://datacite-metadata-schema.readthedocs.io/en/4.5/appendices/appendix-1/resourceTypeGeneral/#image
    term: Image
    active: false
    note: Deprecated in favour of Visual Media - StillImage. The two are the same concept from two authorities (DataCite "A visual representation other than text" versus COAR c_ecc8) and scored identically across the cohort — 56/75, 12 of 15 pathfinders, 8 of 8 disciplines each. COAR wins because the whole rest of this file hangs off the COAR Visual Media hierarchy and all six still-image children are parented on it. Retained, never deleted, because existing deposits may already carry this id; DataCite Image stays the crosswalk target on export.
  - id: https://vocabularies.coar-repositories.org/resource_types/c_ecc8/
    term: Visual Media - StillImage
    note: Canonical still-image term, kept in preference to the deprecated DataCite Image. Parent of the still-image children below. Evidence — 56/75, 12 of 15 pathfinders, 8 of 8 disciplines.
  - id: https://schema.org/Drawing
    term: Visual Media - StillImage - Drawing
    file_suffixes: [jpg, jpeg, png, tiff, tif, svg, pdf]
    note: Freehand or artistic drawing — sketches, studies, working doodles. Evidence — VH-STAIR's "Scans of doodles and thoughts (.pdf)". For measured drawings made to conventions of scale and projection use Visual Media - StillImage - TechnicalDrawing instead.
  - id: http://vocab.getty.edu/page/aat/300034789
    term: Visual Media - StillImage - TechnicalDrawing
    file_suffixes: [pdf, dwg, dxf, svg, tiff, tif, jpg, jpeg, png]
    note: Measured architectural or technical drawing following precise conventions of scale and projection — plans, sections, elevations, orthographic projections, perspectives, schedules. AAT "technical drawings" (300034789). Evidence — VW-AIRGRID's 1-to-50 scaled orthographic ground-floor plan (1 of a set of 7), sections AA and BB, perspective views and sewing schedules; WM-PRIM's competition drawings. Added because these previously shared schema.org/Drawing with VH-STAIR's scanned doodles.
  - id: https://schema.org/Painting
    term: Visual Media - StillImage - Painting
    file_suffixes: [jpg, jpeg, png, tiff, tif]
  - id: https://schema.org/Photograph

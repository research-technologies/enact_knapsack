  - id: https://datacite-metadata-schema.readthedocs.io/en/4.5/appendices/appendix-1/resourceTypeGeneral/#model
    term: Model
    note: Covers digital and 3D models. DataCite defines Model as a graphical or visualisation model representing empirical objects, phenomena or physical processes, which reaches VW-AIRGRID's hybrid 2D/3D digital environment (.mcd) and WM-PRIM's competition models without a further term. No separate 3D-model term was added, deliberately, to keep the picklist readable in one screen. For a physical presentation or study model deposited as an object use Physical Object; for the drawings that accompany it use Visual Media - StillImage - TechnicalDrawing.

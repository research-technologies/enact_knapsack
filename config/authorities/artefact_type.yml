    term: Design - InteriorDesign
  - id: http://vocab.getty.edu/page/aat/300034787
    term: Design - ArchitecturalDesign
    note: Names the architectural design work. Authority mismatch flagged for programme review, not acted on — AAT 300034787 resolves to "architectural drawings (visual works)", an object concept, not a design process; the id is left untouched per the no-id-change rule and the label per the picklist the pathfinder scoring was run against. The drawings themselves now have their own term, Visual Media - StillImage - TechnicalDrawing. Evidence — 5 for VW-AIRGRID and WM-PRIM, 4 for AC-SONGS, PC-PORTS and MF-SGSAH, 0 for both Harris films and both Osgood projects.
  - id: http://vocab.getty.edu/page/aat/300047910
    term: Design - MultimediaDesign
  - id: https://github.com/research-technologies/prvoices_schema/wiki/SoundDesign
    term: Design - SoundDesign
  - id: https://github.com/research-technologies/prvoices_schema/wiki/ExhibitionDesign
    term: Design - ExhibitionDesign
  - id: http://vocab.getty.edu/page/aat/300054190
    term: Design - TheatreDesign
  - id: http://vocab.getty.edu/page/aat/300054766
    term: Exhibition
    note: The exhibition as a realised output, distinct from Design - ExhibitionDesign, which describes the design made FOR an exhibition. AAT "exhibitions (events)". Evidence — GS-UNDER's Undercover online exhibition, opened 11 May 2021, whose whole deposit records the exhibition image files; WM-PRIM's Talbot Rice Gallery show, invitations and installation photographs; VW-AIRGRID at Par Gallery, Croydon, 4 Oct to 8 Nov 2011. Boundary — where the exhibition is the grouping principle for a set of items use collection_type Exhibition (same AAT concept); where it is a dated happening with a venue use event_type.
  - id: https://vocabularies.coar-repositories.org/resource_types/ACF7-8YT9/
    term: Dataset - AggregatedData
  - id: https://vocabularies.coar-repositories.org/resource_types/c_cb28/
    term: Dataset - ClinicalTrialData
    active: false
    note: Deprecated — scored 0 for all 15 pathfinders and all 8 discipline clusters. Inherited from a general-purpose research-data vocabulary and has no application in an arts and humanities practice-research repository. Retained, never deleted, in case an existing deposit carries the id. If clinical data ever arrives, use Dataset - ExperimentalData or Other.
  - id: https://enact.ac.uk/vocab/artefact_type/communications-archive
    term: Dataset - CommunicationsArchive
    file_suffixes: [txt, csv, json, eml, mbox, zip, pdf]
    source: enact
    note: Project communications and correspondence deposited as process documentation — exported chat logs, message archives, email threads. Evidence — RH-RITUAL's Rituals for Earthly Survival WhatsApp Chat Log (.txt), recording project communications May 2024 to March 2025 and evidencing the emergence of composting and Children of the Compost as central creative ideas; ethics-approved and consented, deposited as a closed file with a public metadata record. The same shape recurs in AC-SONGS workshop transcriptions and PPP-QMUL consent forms and collaboration agreements. No COAR, DataCite or AAT term expresses it, so an Enact-local id is minted rather than an authority URI guessed.

    term: Sound
  - id: https://schema.org/MusicComposition
    term: Sound - MusicComposition
    file_suffixes: [xml, mxl, mid, midi, pdf]
    note: Names the musical WORK, not the carrier it is transmitted on. A deposited score is Musical notation in literature_type (COAR c_18cw); the two records are joined by the realisation relationship rather than by duplicating a notation term here — see the cross-cutting decision in Section 5 of the artefact_type relevance report. Evidence — SM-FORK's Strata, paired score (.pdf) plus performance recording, and roughly nine further pairs; also AC-SONGS and SZT-C21MP.
